<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Administrasi Daftar Hadir Instruktur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            @page { size: 330mm 210mm landscape; margin: 10mm; }
            .no-print { display: none !important; }
        }
        .page-container { width: 310mm; min-height: 190mm; margin: auto; padding: 5mm; background: white; border: 1px solid #ccc; margin-bottom: 10px; position: relative; box-sizing: border-box; }
        table { border-collapse: collapse; width: 100%; table-layout: fixed; }
        th, td { border: 1px solid black; padding: 4px; text-align: center; font-size: 11px; vertical-align: middle; }
        
        .kop-table { width: 100%; border: 1px solid black; border-collapse: collapse; margin-bottom: 5px; }
        .kop-table td { border: 1px solid black; padding: 5px; vertical-align: middle; }
        .title-cell { font-weight: bold; font-size: 13px; text-align: center; }

        .info-header { margin-bottom: 10px; font-size: 12px; font-weight: bold; }
        .info-header div { margin-bottom: 2px; }

        .ttd-table { width: 700px; margin-left: auto; border-collapse: collapse; table-layout: fixed; margin-top: 20px; }
        .ttd-table td { border: 1px solid black; padding: 5px; font-size: 11px; vertical-align: top; }
        .ttd-jabatan { height: 30px; font-weight: bold; text-align: center; }
        .ttd-space { height: 180px; text-align: center; }
    </style>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md no-print mb-8">
        <h1 class="text-xl font-bold mb-4 text-center">Sistem Administrasi Daftar Hadir Instruktur</h1>
        <div class="grid grid-cols-2 gap-4">
            <input id="kejuruan" placeholder="Kejuruan" class="border p-2 rounded">
            <input id="program" placeholder="Program" class="border p-2 rounded">
            <input id="bulan" placeholder="Bulan" class="border p-2 rounded">
            <input id="tahun" placeholder="Tahun" class="border p-2 rounded">
            <input id="namaInstruktur" placeholder="Nama Instruktur" class="col-span-2 border p-2 rounded">
            <input id="tglMulai" type="date" class="border p-2 rounded">
            <input id="tglSelesai" type="date" class="border p-2 rounded">
            <div class="col-span-2">
                <label class="block text-sm font-bold mb-1">Paste Data (KodeUnit [TAB] TotalJP):</label>
                <textarea id="inputTabel" rows="4" class="w-full border p-2 rounded text-sm"></textarea>
            </div>
        </div>
        <button onclick="generateSchedule()" class="w-full bg-blue-600 text-white py-2 mt-4 rounded font-bold hover:bg-blue-700">Generate Daftar Hadir</button>
        <button onclick="window.print()" class="w-full bg-green-600 text-white py-2 mt-2 rounded font-bold hover:bg-green-700">Cetak PDF</button>
    </div>

    <div id="printArea"></div>

    <script>
        function generateSchedule() {
            const rawData = document.getElementById('inputTabel').value.trim();
            const start = new Date(document.getElementById('tglMulai').value);
            const end = new Date(document.getElementById('tglSelesai').value);
            const namaIns = document.getElementById('namaInstruktur').value;
            const kejuruan = document.getElementById('kejuruan').value;
            const program = document.getElementById('program').value;
            const bulan = document.getElementById('bulan').value;
            const tahun = document.getElementById('tahun').value;
            const area = document.getElementById('printArea');
            area.innerHTML = '';

            let queue = rawData.split('\n').map(l => { const p = l.split(/\t/); return { code: p[0], jp: parseInt(p[1]) || 0 }; }).filter(i => i.jp > 0);
            let allRows = [];
            let current = new Date(start);
            let counter = 1;
            let queueIdx = 0;
            let currentUnitRem = queueIdx < queue.length ? queue[0].jp : 0;

            while (current <= end && queueIdx < queue.length) {
                if (current.getDay() !== 0 && current.getDay() !== 6) {
                    let dailyTotal = 0;
                    while (dailyTotal < 10 && queueIdx < queue.length) {
                        let take = Math.min(10 - dailyTotal, currentUnitRem);
                        allRows.push({ no: counter++, nama: namaIns, hari: current.toLocaleDateString('id-ID', {weekday:'long'}), tgl: current.toLocaleDateString('id-ID'), jam: `${dailyTotal + 1} s.d. ${dailyTotal + take}`, kode: queue[queueIdx].code, jp: take });
                        dailyTotal += take;
                        currentUnitRem -= take;
                        if (currentUnitRem === 0) { queueIdx++; if (queueIdx < queue.length) currentUnitRem = queue[queueIdx].jp; }
                    }
                }
                current.setDate(current.getDate() + 1);
            }

            const rowsPerPage = 20;
            const totalPages = Math.ceil(allRows.length / rowsPerPage) || 1;
            
            for (let i = 0; i < allRows.length || i === 0; i += rowsPerPage) {
                let page = document.createElement('div');
                page.className = 'page-container';
                let slice = allRows.slice(i, i + rowsPerPage);
                let pageNum = Math.floor(i / rowsPerPage) + 1;
                
                page.innerHTML = `
                    <table class="kop-table">
                        <tr>
                            <td rowspan="4" style="width: 100px; font-weight:bold; font-size: 8px; text-align: center;">LOGO BPVP</td>
                            <td class="title-cell">KEMENTERIAN KETENAGAKERJAAN</td>
                            <td style="width: 80px; font-size: 10px;">No. Dok</td><td style="width: 120px; font-size: 10px;">: F-PNY-19</td>
                        </tr>
                        <tr><td class="title-cell">DIREKTORAT JENDERAL PEMBINAAN PELATIHAN VOKASI DAN PRODUKTIVITAS</td><td style="font-size: 10px;">No. Rev</td><td style="font-size: 10px;">: 00</td></tr>
                        <tr><td class="title-cell">UPT BPVP BANDA ACEH</td><td style="font-size: 10px;">Tgl. Terbit</td><td style="font-size: 10px;">: 18 Okt 2018</td></tr>
                        <tr><td class="title-cell" style="background:#eee">DAFTAR HADIR INSTRUKTUR</td><td style="font-size: 10px;">Halaman</td><td style="font-size: 10px;">: ${pageNum} dari ${totalPages}</td></tr>
                    </table>
                    <div class="info-header">
                        <div>Kejuruan : ${kejuruan}</div>
                        <div>Program : ${program}</div>
                        <div>Bulan / Tahun : ${bulan} / ${tahun}</div>
                    </div>
                    <table>
                        <thead>
                            <tr class="bg-gray-100">
                                <th style="width: 30px;">NO</th>
                                <th>NAMA INSTRUKTUR</th>
                                <th>HARI</th>
                                <th>TANGGAL</th>
                                <th>JAM KE</th>
                                <th>KODE UNIT</th>
                                <th>JUMLAH</th>
                                <th>CEKLIS HADIR</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${slice.map(r => `
                                <tr>
                                    <td>${r.no}</td>
                                    <td>${r.nama}</td>
                                    <td>${r.hari}</td>
                                    <td>${r.tgl}</td>
                                    <td>${r.jam}</td>
                                    <td>${r.kode}</td>
                                    <td>${r.jp}</td>
                                    <td style="font-weight: bold; font-size: 14px;">✓</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                    ${(i + rowsPerPage >= allRows.length) ? `
                        <table class="ttd-table">
                            <tr>
                                <td class="ttd-jabatan">Disiapkan</td>
                                <td class="ttd-jabatan">Diperiksa</td>
                                <td class="ttd-jabatan">Disahkan</td>
                            </tr>
                            <tr>
                                <td class="ttd-space"></td>
                                <td class="ttd-space"></td>
                                <td class="ttd-space"></td>
                            </tr>
                        </table>` : ''}
                `;
                area.appendChild(page);
                if (i + rowsPerPage >= allRows.length) break;
            }
        }
    </script>
</body>
</html>
